seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_file: "data/splits.json"
  crop_size: 192
  modalities:
    - "flair"
    - "t1"
    - "t1ce"
    - "t2"
  num_classes: 4
  empty_keep: 0.2
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

model:
  name: "unet"
  in_channels: 4
  base_filters: 16
  num_classes: 4

training:
  epochs: 5
  batch_size: 4
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 0
  mixed_precision: true
  early_stopping_patience: 5
  checkpoint_dir: "checkpoints"
  checkpoint_name: "best_baseline.pt"
  log_dir: "runs/baseline"

loss:
  type: "combo"
  dice_weight: 1.0
  ce_weight: 1.0
  focal_gamma: 2.0
  focal_alpha: 0.25

augmentation:
  enabled: true
  flip_prob: 0.5
  intensity_scale: true
  nnunet_style: false
